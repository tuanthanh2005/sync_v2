<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#4F46E5" />
        <link
            rel="icon"
            href="/favicon.svg?v=sysnoxis-2"
            type="image/svg+xml"
        />
        <link rel="icon" href="/favicon.ico?v=sysnoxis-2" sizes="any" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png?v=sysnoxis-2"
        />
        <title>SysNoxis — Offline</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f3f5f9;
                --card: #ffffff;
                --fg: #0f172a;
                --muted: #64748b;
                --border: #e2e8f0;
                --primary: #4f46e5;
                --primary-fg: #ffffff;
                --primary-soft: #eef2ff;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0b0f17;
                    --card: #161b26;
                    --fg: #f1f5f9;
                    --muted: #94a3b8;
                    --border: #273244;
                    --primary: #818cf8;
                    --primary-fg: #0b0f17;
                    --primary-soft: #25264a;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1rem
                    calc(1.5rem + env(safe-area-inset-bottom, 0px));
                background: var(--bg);
                color: var(--fg);
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
            }
            .card {
                width: 100%;
                max-width: 400px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 28px 24px;
                text-align: center;
            }
            .brand {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 18px;
            }
            .brand-name {
                font-size: 16px;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .badge {
                width: 56px;
                height: 56px;
                margin: 0 auto 16px;
                border-radius: 14px;
                background: var(--primary-soft);
                color: var(--primary);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 20px;
                font-weight: 700;
            }
            p {
                margin: 0 0 20px;
                font-size: 14px;
                line-height: 1.55;
                color: var(--muted);
            }
            button {
                appearance: none;
                border: 0;
                min-height: 44px;
                padding: 0 22px;
                border-radius: 10px;
                background: var(--primary);
                color: var(--primary-fg);
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                touch-action: manipulation;
            }
        </style>
    </head>
    <body>
        <main class="card" role="main">
            <div class="brand">
                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 40 40"
                    fill="none"
                    style="color: var(--primary)"
                    aria-hidden="true"
                >
                    <path
                        d="M33 5H15A8 8 0 0 0 15 21H17.2L22.6 15.6H15A2.6 2.6 0 0 1 15 10.4H27.6Z"
                        fill="currentColor"
                    />
                    <path
                        d="M7 35H25A8 8 0 0 0 25 19H22.8L17.4 24.4H25A2.6 2.6 0 0 1 25 29.6H12.4Z"
                        fill="currentColor"
                    />
                </svg>
                <span class="brand-name">SysNoxis</span>
            </div>
            <div class="badge" aria-hidden="true">
                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="2" x2="22" y1="2" y2="22" />
                    <path d="M8.5 16.5a5 5 0 0 1 7 0" />
                    <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
                    <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
                    <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
                    <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
                    <line x1="12" x2="12.01" y1="20" y2="20" />
                </svg>
            </div>
            <h1>You are offline</h1>
            <p>
                Unable to reach SysNoxis right now. Check your mobile data or
                Wi-Fi connection and try again.
            </p>
            <button type="button" onclick="window.location.reload()">
                Try again
            </button>
        </main>
    </body>
</html>
